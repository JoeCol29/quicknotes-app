<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p class="tagline">Capture your thoughts, organized by category.</p>
  </header>

  <main>
    <section id="add-note-section">
      <h2>Add a Note</h2>
      <form id="note-form">
        <label for="note-input">Your note</label>
        <input type="text" id="note-input" placeholder="Write something..." maxlength="200">
        <select id="note-category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section id="your-notes-section">
      <h2>Your Notes</h2>
      <input type="text" id="search-input" placeholder="Search notes...">
      <p id="note-count"></p>
      <ul id="notes-list"></ul>
      <button id="clear-all-btn" style="display: none;">Clear All</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 JCol QuickNotes — Built with HTML, CSS & JavaScript</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
